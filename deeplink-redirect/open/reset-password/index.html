<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Open Reset Password</title>
    <style>
      body {
        margin: 0;
        font-family: Arial, sans-serif;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #f5f7fb;
        color: #111827;
      }
      .card {
        width: min(520px, 92vw);
        background: #ffffff;
        border-radius: 16px;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.08);
        padding: 24px;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 22px;
      }
      p {
        margin: 8px 0 16px;
        line-height: 1.45;
      }
      .actions {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
      }
      a.button {
        text-decoration: none;
        border-radius: 10px;
        padding: 10px 14px;
        font-weight: 600;
      }
      .primary {
        background: #4f46e5;
        color: #fff;
      }
      .secondary {
        background: #e5e7eb;
        color: #111827;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>Opening password reset...</h1>
      <p>If the app does not open automatically, tap "Open App" below.</p>
      <div class="actions">
        <a id="openAppBtn" class="button primary" href="#">Open App</a>
        <a
          class="button secondary"
          href="https://play.google.com/store/apps/details?id=com.expense_tracker"
        >
          Install on Play Store
        </a>
      </div>
    </main>

    <script>
      (function () {
        var params = new URLSearchParams(window.location.search);
        var token = params.get("token") || "";
        var encodedToken = encodeURIComponent(token);
        var deepLink = "expensetracker://reset-password?token=" + encodedToken;
        var playStoreUrl =
          "https://play.google.com/store/apps/details?id=com.expense_tracker";

        var openAppBtn = document.getElementById("openAppBtn");
        openAppBtn.setAttribute("href", deepLink);

        window.location.href = deepLink;

        setTimeout(function () {
          window.location.href = playStoreUrl;
        }, 1500);
      })();
    </script>
  </body>
</html>
